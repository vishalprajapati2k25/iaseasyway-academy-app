name: Android CI & Policy Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Verify IEW Academy Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Verify Live Website API Health
        run: |
          echo "Checking iaseasyway.com API endpoint..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://www.iaseasyway.com/wp-json/wp/v2/categories?per_page=1")
          echo "API Status Code: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::warning title=API Notice::Live WordPress API returned status $HTTP_STATUS. App local seed fallback will be active."
          fi

      - name: Run Android Lint
        run: ./gradlew lintDebug

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iaseasyway-academy-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
